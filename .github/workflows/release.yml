name: Android Release

on:
  push:
    tags:
      - 'v*' # Se ejecuta automáticamente cuando creas un tag que empieza por 'v' (ej. v1.0.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Necesario para poder crear la Release en GitHub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Clave de firma fija: sin ella cada release se firma con una clave debug distinta
      # y el Karoo no puede actualizar encima (INSTALL_FAILED_UPDATE_INCOMPATIBLE)
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ALTGRAPH_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ALTGRAPH_KEYSTORE_BASE64 (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/altgraph-release.jks"

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALTGRAPH_KEYSTORE_FILE: ${{ runner.temp }}/altgraph-release.jks
          ALTGRAPH_KEYSTORE_PASSWORD: ${{ secrets.ALTGRAPH_KEYSTORE_PASSWORD }}
          ALTGRAPH_KEY_ALIAS: ${{ secrets.ALTGRAPH_KEY_ALIAS }}
          ALTGRAPH_KEY_PASSWORD: ${{ secrets.ALTGRAPH_KEY_PASSWORD }}

      - name: Extract Tag Name
        id: extract_tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release*.apk
            manifest.json
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
